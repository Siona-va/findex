[project]
name = "findex"
version = "1.0.0"
description = "A full-text search engine over your own corpus (Python course project)"
readme = "README.md"
authors = [{ name = "Valeria Soina" }]
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "jinja2>=3.1",
    "numpy>=1.26",
]

[project.optional-dependencies]
lsa = ["scikit-learn>=1.4"]                                  # offline semantic search
semantic = ["sentence-transformers>=3", "scikit-learn>=1.4"]  # neural embeddings (MiniLM)

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6.100",
    "pyright>=1.1.380",
    "pytest-benchmark>=4",
    "scikit-learn>=1.4",
]
bench = ["matplotlib>=3.8"]

[project.scripts]
findex = "findex.cli:app"

[build-system]
requires = ["uv_build>=0.8,<0.12"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pyright]
include = ["src"]
typeCheckingMode = "strict"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["slow: takes more than a second (deselect with -m 'not slow')"]

[tool.coverage.run]
source = ["findex"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
