[project]
name = "findex"
version = "0.1.0"
description = "A full-text search engine over your own corpus (Python course project)"
readme = "README.md"
authors = [{ name = "Valeria Soina" }]
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["ruff>=0.6", "pytest>=8"]

[build-system]
requires = ["uv_build>=0.8,<0.12"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
