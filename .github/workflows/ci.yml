name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        # --locked once uv.lock exists (the "Lock dependencies" workflow creates it)
        run: |
          if [ -f uv.lock ]; then uv sync --locked --all-groups; else uv sync --all-groups; fi
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Type check (pyright strict)
        run: uv run pyright
      - name: Tests
        run: uv run pytest --cov=findex --cov-report=term-missing
      - name: Benchmarks (pytest-benchmark)
        run: uv run pytest tests/test_benchmarks.py --benchmark-only --benchmark-json=benchmark.json
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-${{ matrix.python-version }}
          path: benchmark.json

  docker:
    # The same image Render builds: check it starts, answers, and fits in 512 MB.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        run: docker buildx build --load -t findex .
      - name: Run and smoke-test
        run: |
          docker run -d --name findex -p 8000:8000 -m 512m findex
          for i in $(seq 30); do curl -fs localhost:8000/health && break; sleep 2; done
          echo; curl -fs "localhost:8000/search?q=asyncio+task+group&k=3" | head -c 600; echo
          curl -fs localhost:8000/ | grep -qi "<html"
          docker stats --no-stream findex
          docker image ls findex
      - name: Logs
        if: always()
        run: docker logs findex | tail -50
