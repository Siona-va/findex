name: Releases

# For every v* tag: make sure a GitHub Release exists AND has the wheel built from that
# tag attached. Releases created by hand without files get their wheel added here.
# (No `release: published` trigger: GitHub would read this file from the TAGGED commit,
#  and the lab commits predate it. Runs on pushes to main or by hand from the Actions tab.)
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - name: Build and attach a wheel for every v* tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --tags --force
          for tag in $(git tag -l 'v*' --sort=version:refname); do
            if gh release view "$tag" --json assets -q '.assets[].name' 2>/dev/null | grep -q '\.whl$'; then
              echo "$tag: wheel already attached"; continue
            fi
            git checkout -q "$tag"
            rm -rf dist && uv build --wheel
            if gh release view "$tag" >/dev/null 2>&1; then
              gh release upload "$tag" dist/*.whl
              echo "$tag: wheel attached to the existing release"
            else
              gh release create "$tag" dist/*.whl --verify-tag --title "findex ${tag#v}" \
                --notes "Install: \`uv tool install <wheel URL>\`, then \`findex --help\`."
              echo "$tag: release created"
            fi
          done
