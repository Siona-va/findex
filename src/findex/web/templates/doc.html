{% extends "base.html" %}
{% block title %}{{ doc.title }} — findex{% endblock %}
{% block main %}
<p class="back"><a href="/?q={{ q|urlencode }}">← back to results</a></p>
<article class="doc">
  <h1>{{ doc.title }}</h1>
  <p class="meta">doc #{{ doc.doc_id }} · {{ doc.length }} tokens · <code>{{ doc.path }}</code></p>
  <pre>{{ text|hl }}</pre>
</article>
{% endblock %}
